# =========================================================
# JWT Configuration
# =========================================================

security.jwt.secret=${JWT_SECRET:c3VwZXJTZWNyZXRLZXlGb3JKV1RTSUdOSU5HQWxnb3JpdGhtSFM1MTJNdXN0QmVBdExlYXN0NjRCeXRlc0xvbmdGb3JTZWN1cml0eQ==}
security.jwt.issuer=${JWT_ISSUER:authentication.com}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost}

# =========================================================
# OAuth2 Configuration
# =========================================================

# =========================================================
# GOOGLE Configuration
# => Redirect URL for google :--->  /login/oauth2/code/google
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.google.scope[0]=email
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=openid

# =========================================================
# GITHUB Configuration
# => Redirect URL for google :--->  /login/oauth2/code/github
# =========================================================

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.github.scope[0]=user:email
spring.security.oauth2.client.registration.github.scope[1]=read:user

# =========================================================
# FRONTEND REDIRECT CONFIGURATION
# =========================================================

app.cors.frontend_url=${FRONT_END_URL:http://localhost:5173}
app.auth.frontend.success-redirect=${FRONT_END_SUCCESS_REDIRECT:http://localhost:5173/oauth/success}
app.auth.frontend.failure-redirect=${FRONT_END_FAILURE_REDIRECT:http://localhost:5173/oauth/failure}